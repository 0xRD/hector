name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be checked by hand (Actions → CI → Run workflow) before a pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      # Pinned to a commit: a moved tag cannot change what runs with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # The release workflow runs the same script with --universal; this catches a broken bundle
      # before a tag is pushed.
      - name: Bundle the app
        run: scripts/bundle-app.sh --zip

      - name: Launch the app (crash, CPU and memory)
        run: scripts/smoke-test.sh .build/Hector.app 20
